<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Seamless Wipes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Seamless Wipes</h1>
    <p>Park the playhead near a cut, then click a wipe.</p>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <button id="remove" class="remove">Remove wipe at this cut</button>
  </main>

  <div id="status" class="status" hidden></div>

  <script src="main.js"></script>
</body>
</html>
